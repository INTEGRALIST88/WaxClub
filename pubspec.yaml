name: waxclub
description: "WaxClub - Real-time karaoke lyrics synchronized with vinyl records and pitch drift compensation."
publish_to: 'none'

version: 1.4.18+24018

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking, Local Cast & APIs
  http: ^1.2.1
  crypto: ^3.0.6
  uuid: ^4.4.0
  multicast_dns: ^0.3.3+1

  # Audio recording & Permissions
  record: ^5.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.3

  # UI & Animations
  scrollable_positioned_list: ^0.3.8
  intl: any
  flutter_secure_storage: ^11.2.0
  webview_flutter: ^4.14.1
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  google_sign_in: ^7.2.0

dependency_overrides:
  # 1.5.0: mesma versão exigida por record_android/record_web; habilita AndroidRecordConfig.audioSource
  record_platform_interface: 1.5.0
  # record_linux 0.7.x não implementa a interface >= 1.2 e quebrava a compilação (motivo do override antigo 1.0.2)
  record_linux: ^1.0.0
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # Textos da interface em lib/l10n/*.arb (gera lib/l10n/gen/app_localizations.dart)
  generate: true

  assets:
    - assets/icon/
    - assets/catalog/
    - assets/images/

  # Fonte da letra (mesma da tela da TV). Licença OFL em assets/fonts/Inter-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    # Letra retrô 3D dos destaques (música/banda, títulos em creme, saudação, marca). Berdano (RantautypeStudio,
    # todos os direitos reservados): comprar a licença comercial (app + web) antes de publicar. Fora do Git.
    - family: Berdano
      fonts:
        - asset: assets/fonts/Berdano-Regular.otf
