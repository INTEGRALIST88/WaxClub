name: waxclub
description: "WaxClub - Real-time karaoke lyrics synchronized with vinyl records and pitch drift compensation."
publish_to: 'none'

version: 1.3.6+2306

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking, Local Cast & APIs
  http: ^1.2.1
  uuid: ^4.4.0
  multicast_dns: ^0.3.3+1

  # Audio recording & Permissions
  record: ^5.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.3

  # UI & Animations
  scrollable_positioned_list: ^0.3.8
  intl: ^0.19.0
  flutter_secure_storage: ^11.2.0
  webview_flutter: ^4.14.1

dependency_overrides:
  # 1.5.0: mesma versão exigida por record_android/record_web; habilita AndroidRecordConfig.audioSource
  record_platform_interface: 1.5.0
  # record_linux 0.7.x não implementa a interface >= 1.2 e quebrava a compilação (motivo do override antigo 1.0.2)
  record_linux: ^1.0.0
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/catalog/
    - assets/images/
