# Memoria do Gradle: o padrao (512 MB) estoura ao empacotar o APK com o catalogo de trilhas
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build
android.useAndroidX=true
# Projeto em H: e cache do Flutter/pub em C: o cache incremental do Kotlin falha entre discos
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
